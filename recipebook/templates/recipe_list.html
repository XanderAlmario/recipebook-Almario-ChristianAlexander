{% extends 'base.html' %}

{% block content %}
    <h2>Recipe List</h2>
    <ul>
    {% for object in recipe_list %}
            <ul><a href= "{{ object.get_absolute_url }}" >{{ object }}</a></ul>
    {% endfor %}
    </ul>
    <button type="submit">
        <a href="{% url 'ledger:recipe-add' %}">Add a recipe</a>
      </button>
{% endblock %}
